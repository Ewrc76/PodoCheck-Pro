<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PodoCheck Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl p-6 flex flex-col gap-4">
        <header class="text-center">
            <h1 class="text-2xl font-bold text-emerald-400">PodoCheck Pro</h1>
            <p class="text-xs text-slate-400">Asistencia Clínica e Inteligencia Artificial Podológica</p>
        </header>

        <div class="flex flex-col gap-2">
            <label class="text-sm font-medium text-slate-300">Captura de la Zona Afectada (Piel o Uñas)</label>
            <input type="file" id="inputFoto" accept="image/*" capture="environment" class="hidden" onchange="manejarArchivo(this)">
            
            <button onclick="document.getElementById('inputFoto').click()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2">
                📷 Tomar / Subir Foto
            </button>
        </div>

        <div id="contenedorVistaPrevia" class="hidden flex flex-col items-center gap-2">
            <img id="imgVistaPrevia" class="w-full h-48 object-cover rounded-xl border border-slate-700" alt="Vista previa">
            <div id="estadoImagen" class="text-xs text-emerald-400 font-medium">✓ Imagen lista y optimizada. Presiona 'Analizar con IA'.</div>
        </div>

        <button id="btnAnalizar" onclick="analizarConIA()" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2">
            🔬 Analizar con IA
        </button>

        <div id="cargandoIA" class="hidden text-center py-4">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent"></div>
            <p class="text-xs text-slate-400 mt-2">Analizando imagen clínica...</p>
        </div>

        <div id="resultados" class="hidden flex flex-col gap-3 bg-slate-900/50 p-4 rounded-xl border border-slate-700">
            <div class="flex justify-between items-center">
                <span class="text-xs text-slate-400">Probabilidad:</span>
                <span id="badgeProbabilidad" class="text-xs bg-emerald-500/20 text-emerald-300 px-2 py-1 rounded-lg font-bold"></span>
            </div>
            <div>
                <span class="text-xs text-slate-400">Afección:</span>
                <h3 id="resTituloAfeccion" class="font-bold text-lg text-slate-100"></h3>
            </div>
            <div>
                <span class="text-xs text-slate-400">Agente / Origen probable:</span>
                <p id="resTipoPatogeno" class="text-sm text-slate-300"></p>
            </div>
            <div>
                <span class="text-xs text-slate-400">Hallazgos visuales:</span>
                <ul id="resListaHallazgos" class="list-disc list-inside text-xs text-slate-300 space-y-1"></ul>
            </div>
            <div>
                <span class="text-xs text-slate-400">Recomendaciones:</span>
                <p id="resRecomendaciones" class="text-xs text-slate-300 bg-slate-800 p-3 rounded-lg border border-slate-700"></p>
            </div>
        </div>
    </div>

    <script>
        const GEMINI_KEY = "AIzaSyA_m7-n5W7rYh8L8-zU6rP6F9W4m2X0J1Q";
        let imagenBase64Limpia = "";

        function manejarArchivo(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;
                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        imagenBase64Limpia = dataUrl.includes(',') ? dataUrl.split(',')[1] : dataUrl;
                        
                        document.getElementById('imgVistaPrevia').src = dataUrl;
                        document.getElementById('contenedorVistaPrevia').classList.remove('hidden');
                        document.getElementById('btnAnalizar').classList.remove('hidden');
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        async function analizarConIA() {
            if (!imagenBase64Limpia) {
                alert("Por favor, selecciona o toma una foto primero.");
                return;
            }

            document.getElementById('cargandoIA').classList.remove('hidden');
            document.getElementById('resultados').classList.add('hidden');

            const promptClinico = "Analiza esta imagen desde una perspectiva estrictamente podológica. Devuelve un JSON válido con esta estructura exacta: {\"afeccion\": \"Nombre clínico exacto\", \"patogeno\": \"Causa u origen\", \"probabilidad\": \"Porcentaje entre 85% y 98%\", \"hallazgos\": [\"Característica 1\", \"Característica 2\"], \"recomendaciones\": \"Recomendaciones de higiene y podología\"}";

            try {
                // Usamos la API oficial con modo de compatibilidad de transporte limpio
                const urlAPI = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`;
                
                const respuesta = await fetch(urlAPI, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: promptClinico },
                                { inline_data: { mime_type: "image/jpeg", data: imagenBase64Limpia } }
                            ]
                        }],
                        generationConfig: { response_mime_type: "application/json" }
                    })
                });

                if (!respuesta.ok) {
                    const errorBody = await respuesta.text();
                    console.error("Detalle técnico del error:", errorBody);
                    throw new Error(`Error HTTP: ${respuesta.status}`);
                }

                const data = await respuesta.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const textoRespuesta = data.candidates[0].content.parts[0].text;
                    const resultadoActual = JSON.parse(textoRespuesta);

                    document.getElementById('badgeProbabilidad').textContent = resultadoActual.probabilidad + " Certeza";
                    document.getElementById('resTituloAfeccion').textContent = resultadoActual.afeccion;
                    document.getElementById('resTipoPatogeno').textContent = "Agente / Origen probable: " + resultadoActual.patogeno;

                    const lista = document.getElementById('resListaHallazgos');
                    lista.innerHTML = '';
                    resultadoActual.hallazgos.forEach(h => {
                        const li = document.createElement('li');
                        li.textContent = h;
                        lista.appendChild(li);
                    });

                    document.getElementById('resRecomendaciones').textContent = resultadoActual.recomendaciones;
                    document.getElementById('resultados').classList.remove('hidden');
                } else {
                    throw new Error("Estructura de respuesta inválida de la IA");
                }
            } catch (error) {
                alert("Error de conexión: Verifica que tu clave de API tenga permisos activos para Generative Language y que no existan bloqueos de red móviles. (" + error.message + ")");
                console.error(error);
            } finally {
                document.getElementById('cargandoIA').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
